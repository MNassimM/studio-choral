services:
  postgres:
    image: postgres:17-alpine
    container_name: butterfly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: butterfly
      POSTGRES_PASSWORD: butterfly
      POSTGRES_DB: butterfly_choral
    ports:
      - "5432:5432"
    volumes:
      - butterfly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U butterfly -d butterfly_choral"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  butterfly-postgres-data:
